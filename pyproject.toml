[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decanting-workspace"
version = "0.1.0"
description = "Dimension-based decanting-cell scene and Pinocchio/Meshcat visualization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "meshcat==0.3.2",
  "numpy>=2.1,<3",
  "PyYAML>=6,<7",
  "pin==4.1.0; platform_system != 'Windows'",
  "robot_descriptions==3.1.0",
  "xacrodoc>=1.1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
fanuc-asset-prep = ["usd-core==25.11"]

[project.scripts]
decanting-view = "decanting_workspace.cli:main"
decanting-assets = "decanting_workspace.asset_prep:main"
decanting-evaluate = "decanting_workspace.candidate_cli:main"
decanting-precompute = "decanting_workspace.precompute_cli:main"
decanting-playback = "decanting_workspace.playback_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
