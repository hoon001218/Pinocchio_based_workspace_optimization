  - name: pallet_camera_arm
    role: camera_support
    center_m: [-2.152363, -7.666484, 3.05]
    size_m: [0.05, 0.85, 0.05]
  - name: tote_camera_pole
    role: camera_support
    center_m: [-1.521816, -8.287957, 0.575]
    size_m: [0.05, 0.05, 1.15]

reference_frames_file: reference_frames.json

pallet:
  center_xy_m: [-2.152362823, -7.316484451]
  size_m: [1.35, 1.0, 0.15]
  lift_support_height_range_m: [0.0, 0.760]
  corner_margin_m: 0.0
  corner_samples_are_alternatives: true

box_skus:
