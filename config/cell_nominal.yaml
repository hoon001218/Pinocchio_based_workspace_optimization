tote:
  size_m: [0.660, 0.440, 0.300]
  representative_frame: ToteLoadFrame
  support_surface_z_m: 0.660
  # Local long X axis is rotated onto the worktable's short World-Y axis.
  representative_yaw_deg: 90.0
  # The frame and tote can translate together along this table's long axis.
  motion_support_box: worktable_current_a

robots:
  ur20:
    urdf: ../assets/robots/ur20/ur20_primitive.urdf
    nominal_base: [-0.984849334, -7.267639160, 0.730275512, 90.0]
    # Shoulder pan aims the folded arm from the base toward the pallet center.
    nominal_q_deg: [79.641629852, -90.0, 90.0, -90.0, -90.0, 0.0]
    pedestal:
      size_xy_m: [0.30, 0.30]
      center_offset_local_xy_m: [0.0, 0.0]
    suction_proxy:
      cylinder_length_m: 0.20
      cylinder_radius_m: 0.01
      pad_radius_m: 0.075
      pad_thickness_m: 0.024
      tcp_translation_local_m: [0.0, 0.0, 0.224]
  sr12ia:
    urdf: ../assets/robots/sr12ia/sr12ia_approx.urdf
    nominal_base: [-0.233218148, -7.073643684, 0.554805667, -90.0]
    # Opposite-elbow branch. tool0 is 0.10 m toward the worktable from
    # UncasingLoadFrame and 0.02 m inside the configured cutting workspace's
    # conveyor-side edge; its +X axis stays aligned with UncaseGroup local +Y.
    nominal_q: [1.287263955214, -1.459295608198, 0.10, 0.172031652984]
    pedestal:
      size_xy_m: [1.10, 0.75]
      center_offset_local_xy_m: [0.284964, 0.0]
    module_camera_mode: with_base
    module_camera_boxes_local:
      - name: uncasing_camera_pole_left
        role: camera_support
        center_m: [0.598084, -0.4, 0.403507]
        size_m: [0.05, 0.05, 0.807014]
      - name: uncasing_camera_pole_right
        role: camera_support
        center_m: [0.598084, 0.4, 0.403507]
        size_m: [0.05, 0.05, 0.807014]
    workspace:
      link_lengths_m: [0.45, 0.45]
      arm_plane_height_m: 0.336
      q1_range_deg: [-145.0, 145.0]
      q2_range_deg: [-145.0, 145.0]
      j3_stroke_options_m: [0.30, 0.45]
      total_height_options_m: [0.918, 1.068]
      q4_range_deg: [-720.0, 720.0]
      tool_radius_m: 0.05
      safety_clearance_m: 0.0
