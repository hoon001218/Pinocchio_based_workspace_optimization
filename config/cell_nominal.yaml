schema_version: 1
units: m

provenance:
  geometry_source: ../cu_usd_simplified.usd
  frame_source: ../BGF/load_group_transforms_true.json
  notes:
    - Fixed collision geometry is limited to geometry present in the simplified USD.
    - The missing GroundPlane payload is replaced by the z=0 floor.
    - Missing RealSense payloads are excluded; their support poles remain.
    - USD test-box dimensions and temporary below-floor pedestal heights are overridden.

world:
  up_axis: Z
  floor_z_m: 0.0

installation_region:
  interpretation: >-
    Raw one-cell strip between the corrected pallet right face and the main
    conveyor left face. Its y extent starts at the Conv5A north edge and spans
    1.29612 m toward +Y. Footprints, yaw, and clearance must still be checked.
  raw_xy_min_m: [-1.477362823, -7.959995]
  raw_xy_max_m: [0.3654805, -6.663875]
  offset_from_worktable_m: 1.29612
  nominal_yaw_center_bounds:
    ur20:
      yaw_deg: 90.0
      xy_min_m: [-1.327362823, -7.809995]
      xy_max_m: [0.2154805, -6.813875]
    sr12ia:
      yaw_deg: -90.0
      xy_min_m: [-1.102362823, -7.125031]
      xy_max_m: [-0.0095195, -6.928911]

static_boxes:
  - name: conveyor_level_3
    role: conveyor
    center_m: [0.7, -5.542254925, 2.36]
    size_m: [0.669039, 9.2, 0.10]
  - name: conveyor_level_2
    role: conveyor
    center_m: [0.7, -5.542254925, 1.18]
    size_m: [0.669039, 9.2, 0.10]
  - name: conveyor_level_1
    role: conveyor
    center_m: [0.7, -5.542254925, 0.61]
    size_m: [0.669039, 9.2, 0.10]
  - name: worktable_far_a
    role: worktable
    center_m: [-0.554982, -5.032856, 0.61]
    size_m: [1.8, 0.65, 0.10]
  - name: worktable_far_b
    role: worktable
    center_m: [-0.554982, -4.357999, 0.61]
    size_m: [1.8, 0.65, 0.10]
  - name: worktable_current_a
    role: worktable
    center_m: [-0.554982, -8.284995, 0.61]
    size_m: [1.8, 0.65, 0.10]
  - name: worktable_current_b
    role: worktable
    center_m: [-0.554982, -8.954703, 0.61]
    size_m: [1.8, 0.65, 0.10]
  - name: pallet_camera_pole
